## SWAG proxy conf for Termin.
## Copy to /mnt/user/appdata/swag/nginx/proxy-confs/termin.subdomain.conf.
## Termin must be on the same custom Docker network as SWAG, with container name "termin".
## The certificate must cover termin.<your domain> (SUBDOMAINS, wildcard, or EXTRA_DOMAINS).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name termin.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 1m;

    # No Authelia/Authentik here: claude.ai must reach /mcp, /authorize and
    # /.well-known directly. Termin does its own OAuth.

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app termin;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # /mcp can stream server-sent events; do not buffer them.
        proxy_buffering off;
    }

    location = /metrics {
        return 404;
    }
}
